<script>
const W=[["在山妖洞中","格里格","《培尔·金特》戏剧配乐中的著名段落。管弦乐版本从神秘、轻微的动机逐渐发展成激烈的场面。","听反复的主题如何越来越快、越来越响；辨别乐器音色如何变化。","结合教学钢琴谱分析固定音型、断奏、渐强和速度推进。原曲与改编谱不应混为一谈。","https://commons.wikimedia.org/wiki/File:Musopen_-_In_the_Hall_Of_The_Mountain_King.ogg","公有领域录音，需联网"],["少女的祈祷","巴达捷夫斯卡","十九世纪钢琴小品，具有歌唱性的旋律和装饰性音型。","找出安静的旋律和闪亮的快速装饰音。","注意旋律与装饰音的主次关系、旋律歌唱性和左右手平衡。"],["巧克力曲奇","Catherine Rollin","儿童钢琴教材中的作品，含英文歌词。作品背景以谱面可证信息为准。","听旋律如何与歌词的节奏配合。","按谱面歌词划分乐句，关注节拍、停顿和分句。"],["四级A组·规定曲目","谱面署名待逐项核验","来自上传教学曲集的四级规定曲目。其完整作品身份尚未核实。","听主题重复、音型和乐句变化。","据谱训练三连音、指法与声部协调；请勿据此推定原作信息。"],["六级B组·规定曲目","谱面署名待逐项核验","来自上传教学曲集的六级规定曲目。","感受旋律与伴奏的交流。","据谱关注旋律连贯、伴奏均匀和双手配合。"],["四小天鹅舞曲","柴科夫斯基","出自芭蕾舞剧《天鹅湖》，以轻巧而整齐的节奏著称。","听音乐是否像四只小天鹅同时迈着整齐的脚步。","关注稳定的拍点、轻巧断奏与整齐的动作感。"],["演艺人","斯科特·乔普林","乔普林的拉格泰姆代表作之一，具有鲜明的切分节奏。","找出听起来像在错开重拍的活泼节奏。","针对教学改编版训练切分节奏、强弱变化和左手伴奏稳定。","https://commons.wikimedia.org/wiki/File:%22The_Entertainer%22_(1902),_by_Scott_Joplin.mp3","音频授权请以来源页面为准"],["孤勇者","原曲作者与编配版本待核对","教学曲集含该流行歌曲的钢琴改编版。","听主旋律的起伏和反复。","以当前编配为准，练习节拍与旋律突出。"],["童年的回忆（版本一）","演奏版本常见理查德·克莱德曼","上传曲集中有《童年的回忆》不同乐谱，不能仅凭译名断定同一原作。","听分解和弦如何托起旋律。","重点训练左手均匀与右手旋律表现；作曲者署名待确认。"],["圣诞快乐，劳伦斯先生","坂本龙一","同名电影配乐主题，曲集中有不同难度的改编。","听旋律中重复与变化，感受情绪的推进。","注意节拍、分句与配器改编差异。录音版权未获授权，不内置。"],["玻璃鞋","William Gillock","曲集收录《The Glass Slipper》钢琴作品。","听旋律是否像舞步，分辨不同段落的性格。","按谱面演奏术语处理舞曲性格和乐句呼吸。"],["梦中的婚礼","保罗·德·塞内维尔（作曲）","理查德·克莱德曼的演奏让这首乐曲广为人知。","感受长线条旋律与分解和弦伴奏。","训练旋律突出、连贯与伴奏的均匀；勿误署克莱德曼为作曲者。"],["四级B组·圆舞曲","谱面署名肖邦","教学谱仅写“肖邦·圆舞曲”，尚未核实具体作品编号。","数三拍，感受圆舞曲的律动。","根据教学谱训练三拍子律动和轻盈左手；不能直接匹配B.150录音。"],["初雪·分解伴奏练习版","具体作曲署名待核对","这是伴奏教学谱，不宜直接称为班得瑞官方原谱。","听长音和流动的分解和弦。","结合和弦标记训练连接、音色与伴奏均匀。"],["诀别书","原作及编配作者待核对","曲集收录小汤三简化教学版本。","寻找旋律中的停顿与呼吸。","依谱练习简短乐句与休止符。"],["圣诞快乐，劳伦斯先生（简易版）","坂本龙一（原曲）","与曲集中较完整版本对应同一主题的不同教学编配。","比较简易版本与原作主题的差别。","训练简化伴奏下的稳定节奏和旋律。"],["花之舞","DJ OKAWARI","当代器乐作品的教学改编版本。","听反复旋律怎样产生流动感。","训练动机反复、乐句衔接与节奏。"],["菊花台","周杰伦（原曲）","华语流行歌曲钢琴改编。","听旋律如何像唱歌一样自然分句。","关注歌唱性和左手的支撑作用。"],["童年","班得瑞版本归属待核实","谱面标注“班得瑞曲”，作曲者与录音版本尚不能确认。","用自己的语言描绘听见的童年画面。","训练固定伴奏音型、旋律层次和均匀速度。"],["童年的回忆（版本二）","原作身份待核查","该谱面标注英文Childhood Memory，不能据此推定与另一版本同曲。","比较右手旋律与左手分解和弦。","依据该版乐谱练习双手平衡，保留版本待核实提示。"]];let current=0,mode="child",page="home";const el=id=>document.getElementById(id);function show(p){page=p;for(const n of ["home","catalog","detail"])el(n).classList.toggle("on",p===n);window.scrollTo(0,0)}
function catalog(){el("items").innerHTML=W.map((w,i)=>({w,i})).filter(({w})=>(w[0]+w[1]).toLowerCase().includes(el("filter").value.trim().toLowerCase())).map(({w,i})=>'<button class="tile" data-item="'+i+'"><div class="bookrow"><span class="num">'+String(i+1).padStart(2,"0")+'</span><div><strong>'+w[0]+'</strong><div class="sub">'+w[1]+'</div></div><span class="arrow">›</span></div></button>').join("")||'<p>暂无对应作品</p>';show("catalog")}
function detail(i){current=i;el("title").textContent=W[i][0];el("composer").textContent=W[i][1];el("local").value="";el("localplayer").innerHTML="";mode="child";render();show("detail")}
function render(){const w=W[current];el("child").classList.toggle("sel",mode==="child");el("teacher").classList.toggle("sel",mode==="teacher");el("content").innerHTML=mode==="child"?'<div class="card"><h3>认识这首作品</h3><p>'+w[2]+'</p></div><div class="card"><h3>仔细听一听</h3><p>'+w[3]+'</p></div><div class="card"><h3>音乐小问题</h3><p>你听到了什么变化？哪一段最吸引你？你能说出音乐带给你的感受吗？</p></div>':'<div class="card"><h3>作品背景</h3><p>'+w[2]+'</p></div><div class="card"><h3>音乐分析与教学重点</h3><p>'+w[4]+'</p></div><div class="notice">编辑审核：作品与教学版本可能不同；不确定的作曲信息和演奏授权不得按已核实发布。</div>';
el("recording").innerHTML=w[5]?'<div class="audio"><div>♬ 授权候选录音</div><audio controls preload="none" src="'+w[5].replace("/wiki/File:","/wiki/Special:Redirect/file/")+'"></audio><div class="sub" style="color:#e0d5c2">'+w[6]+'</div><a href="'+w[5]+'" target="_blank" rel="noopener" style="color:#e5c48e">查看录音来源与授权</a></div>':'<div class="audio"><strong>♬ 暂无可内置的授权录音</strong><p style="font-size:12px">此作品可选择本地合法持有的音频试听。为避免误配或侵权，不自动使用商业录音。</p></div>'}
el("open").onclick=catalog;el("navbooks").onclick=catalog;el("navhome").onclick=()=>show("home");el("navtop").onclick=()=>window.scrollTo(0,0);el("back").onclick=()=>page==="detail"?catalog():show("home");el("filter").oninput=catalog;el("items").onclick=e=>{const item=e.target.closest("[data-item]");if(item)detail(+item.dataset.item)};el("child").onclick=()=>{mode="child";render()};el("teacher").onclick=()=>{mode="teacher";render()};el("local").onchange=e=>{const f=e.target.files?.[0];if(f)el("localplayer").innerHTML='<audio controls style="width:100%;margin-top:12px" src="'+URL.createObjectURL(f)+'"></audio>'};
</script></body></html>
