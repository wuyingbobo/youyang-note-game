<script>
const W=[["在山妖洞中", "格里格", "《培尔·金特》戏剧配乐中的著名段落。管弦乐版本从神秘、轻微的动机逐渐发展成激烈的场面。", "同一个短主题反复出现，就像脚步越来越近。先用手指轻点拍子，再留意声音的强弱和速度：紧张感不一定来自新旋律，也能来自熟悉旋律的变化。", "格里格为易卜生戏剧《培尔·金特》写作配乐；本曲亦为第一组曲 Op.46 第四曲。教材是钢琴改编，开头标有行进性与强调的要求，不能照搬管弦乐录音的全部速度设计。课堂可先保持速度只改变力度，再保持力度改变速度，比较两种推进手段。", "5–6", "如果旋律不变，哪些变化仍会让你觉得山妖越来越近？"], ["少女的祈祷", "巴达捷夫斯卡", "十九世纪钢琴小品，具有歌唱性的旋律和装饰性音型。", "先听旋律像怎样的一口长气，再听周围闪亮的音符。你可以把旋律想成说话的人，把装饰音想成衣服上的花边；花边再漂亮，也不要遮住声音。", "谱面题为 Modlitwa dziewicy，署名巴达捷夫斯卡。教学重点是旋律与装饰的层次，而非把快音弹得越快越好。先抽出旋律独奏，再加入伴奏；用录音检查装饰音前后是否仍能听见完整乐句。不要把标题扩写成未经证实的作曲故事。", "1–2", "拿掉那些快速音符，你还认得出旋律吗？"], ["巧克力曲奇", "Catherine Rollin", "儿童钢琴教材中的作品，含英文歌词。作品背景以谱面可证信息为准。", "这是一首可以边唱边弹的曲奇小歌。试着先按歌词节奏拍手，再把同样的轻快感带到琴键上；音乐中的停顿也像说话时换气。", "出版社确认本曲为 Catherine Rollin 的初级 C 大调教学曲。谱面 Happily 是性格提示。先读词再拍节奏，最后弹奏；评价重点是歌词重音与乐句的自然衔接，不要求儿童模仿并不存在的历史场景。", "3–4", "哪一个停顿最像说完一句话？"], ["练习曲（四级 A 组）", "谱面署名：车尔尼 · 作品号待核", "来自上传教学曲集的四级规定曲目。其完整作品身份尚未核实。", "这首练习曲里的音符像一串串小珠子。先听它们是否均匀，再找一串音符中最想走向的那个音。均匀并不等于每个音都一样重。", "PDF 标为四级 A 组第1首练习曲，谱面署名车尔尼；具体作品号未核实。开头的三连音应作为一组运动练习，先慢速分组再合手。让学生在稳定脉搏中唱出走向，避免把练习曲只当作手指速度测验。", "7–10", "一组三个音，怎样弹才像一句话而不是三次敲门？"], ["布列舞曲（六级 B 组）", "谱面署名：泰勒曼 · 作品号待核", "来自上传教学曲集的六级规定曲目。", "布列舞曲带着清楚的舞步感。先找到稳稳的拍子，再听短小的旋律怎样一问一答。句子之间的小空隙，会让舞步更轻巧。", "PDF 标为六级 B 组第2首布列舞曲，谱面署名泰勒曼；作品目录号尚未核实。先分辨乐句和声部，再练习轻巧而连贯的触键。不要仅凭舞曲名称套用所有巴洛克装饰规则；以当前谱面的连线、休止与力度为依据。", "11–12", "哪两句像是在互相回答？"], ["四小天鹅舞曲", "柴科夫斯基", "出自芭蕾舞剧《天鹅湖》，以轻巧而整齐的节奏著称。", "想象四位舞者同时迈步：有人快一点，整队就散了。听短音之间的空隙，再轻轻拍出稳定的节奏，感受整齐而轻盈的力量。", "作品出自柴科夫斯基芭蕾《天鹅湖》。这页是教学钢琴谱，应区别于舞剧管弦乐原谱。先在慢速下统一短音长度，再处理左右手落点；断奏不等于尖硬，轻巧也不等于节拍松散。", "13", "轻巧和小声是一回事吗？试着举一个音乐里的例子。"], ["演艺人", "斯科特·乔普林", "乔普林的拉格泰姆代表作之一，具有鲜明的切分节奏。", "右手像一个爱开玩笑的人，有时偏偏不在你以为的地方落脚；左手却稳稳地走。先拍稳拍子，再听旋律如何在拍子之间跳动。", "美国国会图书馆保存的原版出版信息为1902年。拉格泰姆的切分节奏依赖稳定的拍点；本页标注 not fast，教学不宜一味加速。先单独拍旋律节奏，再叠加左手脉搏，检查切分处是否被拉长或抢拍。", "14", "你能一边打稳拍子，一边指出旋律错开拍点的地方吗？"], ["孤勇者", "原曲作者与编配版本待核对", "教学曲集含该流行歌曲的钢琴改编版。", "先把钢琴旋律轻轻唱出来：哪一句像低声诉说，哪一句更有力量？不要只靠弹得响来表现勇气，清楚的节奏和坚定的句尾也能做到。", "PDF 收录 IvyLili 标识的钢琴编配，并标有陈奕迅演唱。演唱者不等于作曲者；本次未用权威发行署名完成作者交叉核实，保留待核提示。教学可比较主歌与副歌音区、力度和重复方式，避免用标题代替音乐分析。", "15–17", "同一句旋律，用坚定和温柔两种方式弹，会改变什么？"], ["童年的回忆 · Souvenirs d’enfance", "演奏版本常见理查德·克莱德曼", "上传曲集中有《童年的回忆》不同乐谱，不能仅凭译名断定同一原作。", "左手像连续的小波纹，右手在上面唱一条长长的歌。先只听歌声，再听波纹；两者放在一起时，试着始终追踪那条旋律。", "本版英文/法文标题为 Souvenirs d’enfance，PDF 18–22页；与后面的 Childhood Memory 分开建档。谱面有塞内维尔、图森署名，完整作者信息仍需权威版本核对。练习时先以和弦概括伴奏，再恢复分解音型，检查旋律是否被遮住。", "18–22", "当左手变得很轻时，旋律的方向更清楚了吗？"], ["圣诞快乐，劳伦斯先生", "坂本龙一", "同名电影配乐主题，曲集中有不同难度的改编。", "开头的小音型会回来，好像记忆里的一个声音。每次再听到它，留意周围的和声和音区有没有变化。重复也可以带来新的心情。", "本曲为坂本龙一的电影音乐主题。此处23–27页版本含和弦符号和较丰富织体；43–44页另有“小汤3版本”。比较时先对齐旋律，再看伴奏密度、音区与和弦配置；简易版不是作曲家的另一部作品。", "23–27", "同一个旋律回来时，听起来一定和第一次一样吗？"], ["玻璃鞋", "William Gillock", "曲集收录《The Glass Slipper》钢琴作品。", "这只玻璃鞋跳的是三拍子的舞。轻轻数“一、二、三”，再找一找：旋律是不是一直待在右手？有时左手也会站到舞台中央。", "Gillock 的 The Glass Slipper，出版社说明为 C 大调圆舞曲，并特别强调左手旋律。谱面标 In waltz time。课堂先交换听觉焦点：唱左手、轻弹右手，再合奏；三拍的重心应有弹性，不能每拍都砸重。", "28–30", "旋律换到左手时，你能不看手也听出来吗？"], ["梦中的婚礼", "作曲署名待权威版本复核", "理查德·克莱德曼的演奏让这首乐曲广为人知。", "旋律像一条长长的丝带，伴奏在下面流动。试着跟着旋律画弧线：哪里升起，哪里落下？让每句话有方向，比一直弹得很响更动人。", "谱题 Mariage d’amour。原网页单一作者署名与该谱的复合署名需进一步核对，因此不把演奏者或单一网络归属当作定论。教学以旋律连贯、伴奏轻重和段落高潮为重点；踏板须随和声与听觉清晰度调整。", "31–33", "哪一处最像整句话的最高点？你听见了什么依据？"], ["四级B组·圆舞曲", "谱面署名肖邦", "教学谱仅写“肖邦·圆舞曲”，尚未核实具体作品编号。", "圆舞曲的三拍子像轻轻转圈。第一拍给一点方向，第二、三拍轻轻跟上。试试看：如果三拍都弹得一样重，舞步会变成什么样？", "PDF 题为四级 B 组第3首圆舞曲，署名肖邦。具体作品号尚未据权威谱本核实，不使用效果图里的 a 小调或任何编号替代证据。可先练低音到和弦的距离，再加入旋律，避免左手跳跃造成重拍拖延。", "34–36", "怎样让人听见三拍子，又不觉得每小节都停一下？"], ["初雪·分解伴奏练习版", "具体作曲署名待核对", "这是伴奏教学谱，不宜直接称为班得瑞官方原谱。", "左手把和弦拆成一个个音，像一串慢慢落下的雪花。这是聆听时的想象，不是作曲家的真实故事。听一听和弦换了以后，颜色是否也变了。", "PDF 37–41页明确写“初雪 分解伴奏”，含 Am、Dm 等和弦标记。它属于伴奏教学材料，不能据标题称为某唱片的官方原谱。先弹柱式和弦听连接，再恢复分解织体；换和弦时保持脉搏，不用踏板掩盖换指问题。", "37–41", "如果保留节奏、只换一个和弦，情绪会怎样变化？"], ["诀别书", "原作及编配作者待核对", "曲集收录小汤三简化教学版本。", "先听短句在哪里停下来。停顿不是忘记弹，而是音乐在呼吸。把句尾留出空间，再接下一句，就像认真说一封短信。", "本页标“诀别书 小汤3版”，带工作室标识；编配身份可见，原作者署名本页不足以确认。这里“小汤3”是编配难度标签，不是汤普森原教材曲目的证明。练习旋律节奏、休止和句尾释放，避免人为添加未经谱面支持的煽情停顿。", "42", "有声音与没有声音的地方，哪一个更让你想继续听？"], ["圣诞快乐，劳伦斯先生（简易版）", "坂本龙一（原曲）", "与曲集中较完整版本对应同一主题的不同教学编配。", "这份版本用更少的音留下熟悉的旋律。把它和另一版开头比较：少了哪些声音？哪些音一出现，你仍会认出这首曲子？", "PDF 43–44页标“小汤3版本”，原曲署名坂本龙一。先保证主题节奏与长音时值，再处理简化伴奏的平衡。让学生指出编配删减和保留的内容，理解难度降低并不等于音乐表达减少。", "43–44", "只留下旋律时，作品最容易辨认的特点是什么？"], ["花之舞", "DJ OKAWARI", "当代器乐作品的教学改编版本。", "一小段旋律反复流动，像花瓣绕着风打转。每次重复时，听一听它是在原地，还是到了更高、更低的地方。", "PDF 45–46页为“小汤3版”，署名 DJ Okawari。此处按教学编配分析，不把电子音乐原录音的层次直接套入钢琴谱。先固定节拍，再练短动机接续；检查换句时是否无意加速。", "45–46", "重复的一句怎样弹才既统一又有方向？"], ["菊花台", "周杰伦（原曲）", "华语流行歌曲钢琴改编。", "这是一首适合先唱再弹的旋律。读一读谱下的歌词，找出一句话说到哪里才完整；琴上的连贯也应该像唱歌一样自然。", "PDF 47–48页标“小汤3版”，附歌词。教学先按歌词划分呼吸，再核对连线和时值；歌唱性不等于随意拖拍。原网页标周杰伦原曲，本次尚未完成发行资料逐项核对，作词与编配署名不自行补齐。", "47–48", "歌词还没说完时，音乐有没有被你不小心截断？"], ["童年", "班得瑞版本归属待核实", "谱面标注“班得瑞曲”，作曲者与录音版本尚不能确认。", "这首器乐曲没有规定你必须想起哪一件事。先听旋律重复和变化，再选一种颜色描述它，并说说是高低、快慢还是强弱让你这样想。", "PDF 49–52页题为“童年”，署名“班得瑞曲”。班得瑞作为录音项目署名不能直接替代个人作曲者信息；也不能与罗大佑同名歌曲混同。先分析重复音型与旋律层次，再核对唱片原名，暂不填写年份与个人作者。", "49–52", "如果不给你看标题，你还会想到童年吗？为什么？"], ["童年的回忆 · Childhood Memory", "原作身份待核查", "该谱面标注英文Childhood Memory，不能据此推定与另一版本同曲。", "标题写着 Childhood Memory。先哼开头，再和前面的法文标题作品比较；名字相近，不代表旋律也相同。让耳朵帮你分辨。", "PDF 53–55页标 Childhood Memory，并有班得瑞与改编署名；56–57页无可辨识乐谱内容。应独立于 Souvenirs d’enfance 保存。课堂用两首开头做辨听，再比较伴奏织体；原作与录音归属仍待权威目录核实。", "53–55", "两首都叫童年的回忆，你能用旋律而不是标题区分吗？"]];let current=0,mode="child",page="home";const el=id=>document.getElementById(id);function show(p){page=p;for(const n of ["home","catalog","detail"])el(n).classList.toggle("on",p===n);window.scrollTo(0,0)}
function catalog(){el("items").innerHTML=W.map((w,i)=>({w,i})).filter(({w})=>(w[0]+w[1]).toLowerCase().includes(el("filter").value.trim().toLowerCase())).map(({w,i})=>'<button class="tile" data-item="'+i+'"><div class="bookrow"><span class="num">'+String(i+1).padStart(2,"0")+'</span><div><strong>'+w[0]+'</strong><div class="sub">'+w[1]+'</div></div><span class="arrow">›</span></div></button>').join("")||'<p>暂无对应作品</p>';show("catalog")}
const SCENES=["mountain", "prayer", "cookies", "study", "bourree", "swans", "ragtime", "courage", "souvenirs", "lawrence", "slipper", "wedding", "waltz", "snow", "farewell", "lawrence", "flower", "chrysanthemum", "childhood", "memory"];const PORTRAITS={"8": ["clayderman", "演奏家 · 理查德·克莱德曼"],"0": ["grieg", "格里格"], "4": ["telemann", "泰勒曼"], "5": ["tchaikovsky", "柴科夫斯基"], "6": ["joplin", "斯科特·乔普林"], "9": ["sakamoto", "坂本龙一"], "12": ["chopin", "肖邦"], "15": ["sakamoto", "坂本龙一"]};
function paintArt(i){const person=PORTRAITS[i];el("portrait-banner").classList.toggle("has-portrait",!!person);el("portrait-banner").classList.toggle("landscape-banner",i===17);el("portrait").innerHTML=person?'<img src="art/'+person[0]+'.webp" alt="'+person[1]+'的艺术绘制肖像" width="240" height="320"><span>艺术绘制肖像</span>':'';el("scene").innerHTML='<img src="art/'+SCENES[i]+'.webp" alt="《'+W[i][0]+'》的音乐意境插画" width="900" height="600" decoding="async"><figcaption>音乐里的画面 · 艺术想象</figcaption>';}
function detail(i){paintArt(i);current=i;el("title").textContent=W[i][0];el("composer").textContent=i===8?"演奏家 · 理查德·克莱德曼":W[i][1];el("local").value="";el("localplayer").innerHTML="";mode="child";render();show("detail")}
function render(){const w=W[current];el("child").classList.toggle("sel",mode==="child");el("teacher").classList.toggle("sel",mode==="teacher");el("content").innerHTML=mode==="child"?'<div class="card"><h3>认识这首作品</h3><p>'+w[2]+'</p></div><div class="card"><h3>仔细听一听</h3><p>'+w[3]+'</p></div><div class="card"><h3>音乐小问题</h3><p>'+w[6]+'</p></div>':'<div class="card"><h3>作品背景</h3><p>'+w[2]+'</p></div><div class="card"><h3>音乐分析与教学重点</h3><p>'+w[4]+'</p></div><div class="notice">编辑审核：作品与教学版本可能不同；不确定的作曲信息和演奏授权不得按已核实发布。</div>';
el("recording").innerHTML='<details class="card"><summary>版本与资料依据</summary><p>曲集 PDF 第 '+w[5]+' 页（文件页序）。教学建议为本站依据谱面所作的聆听与练习设计；未核实项目已在教师版注明。</p><p><a href="https://www.laphil.com/works/peer-gynt-suite-no-1-op-46" target="_blank" rel="noopener">洛杉矶爱乐：培尔·金特第一组曲</a><br><a href="https://www.loc.gov/item/2023864238/" target="_blank" rel="noopener">美国国会图书馆：The Entertainer 原版</a><br><a href="https://www.alfred.com/products/chocolate-chip-cookies-00-19752" target="_blank" rel="noopener">Alfred：Chocolate Chip Cookies</a><br><a href="https://www.halleonard.com/product/416418/the-glass-slipper" target="_blank" rel="noopener">Hal Leonard：The Glass Slipper</a></p></details>'}

el("open").onclick=catalog;el("navbooks").onclick=catalog;el("navhome").onclick=()=>show("home");el("navtop").onclick=()=>window.scrollTo(0,0);el("back").onclick=()=>page==="detail"?catalog():show("home");el("filter").oninput=catalog;el("items").onclick=e=>{const item=e.target.closest("[data-item]");if(item)detail(+item.dataset.item)};el("child").onclick=()=>{mode="child";render()};el("teacher").onclick=()=>{mode="teacher";render()};el("local").onchange=e=>{const f=e.target.files?.[0];if(f)el("localplayer").innerHTML='<audio controls style="width:100%;margin-top:12px" src="'+URL.createObjectURL(f)+'"></audio>'};
</script></body></html>
