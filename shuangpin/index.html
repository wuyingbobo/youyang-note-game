body:has(.keyboardPanel) .key.finger-0,body:has(.keyboardPanel) .key.finger-1,body:has(.keyboardPanel) .key.finger-2,body:has(.keyboardPanel) .key.finger-3,body:has(.keyboardPanel) .key.finger-4,body:has(.keyboardPanel) .key.finger-5,body:has(.keyboardPanel) .key.finger-6,body:has(.keyboardPanel) .key.finger-7{color:#19355b}
</style></head>
<body><header class="top"><div class="brand"><span class="panda">🐼</span><div><h1>双拼闯关训练营</h1><div class="muted">双拼打字启蒙训练 · 小鹤双拼</div></div></div><div class="status"><div><strong>⭐ <span id="score">0</span></strong></div><div><strong id="progressLabel">第1题 / 共10题</strong><div class="progress"><div id="progressBar"></div></div></div><div><strong id="levelTitle">第1关｜键位入门</strong></div></div></header>
<main class="shell"><section class="question"><div class="coach"><div class="face"><svg viewBox="0 0 170 150" width="100%" height="130" xmlns="http://www.w3.org/2000/svg" aria-label="熊猫教练"><ellipse cx="85" cy="135" rx="68" ry="11" fill="#90cfb1" opacity=".35"/><circle cx="42" cy="34" r="23" fill="#222d3c"/><circle cx="127" cy="34" r="23" fill="#222d3c"/><ellipse cx="85" cy="78" rx="65" ry="63" fill="#fff" stroke="#dce7f0" stroke-width="2"/><ellipse cx="57" cy="73" rx="19" ry="24" fill="#242e3e" transform="rotate(17 57 73)"/><ellipse cx="114" cy="73" rx="19" ry="24" fill="#242e3e" transform="rotate(-17 114 73)"/><ellipse cx="63" cy="69" rx="7" ry="9" fill="#fff"/><ellipse cx="109" cy="69" rx="7" ry="9" fill="#fff"/><circle cx="64" cy="69" r="3" fill="#212d43"/><circle cx="110" cy="69" r="3" fill="#212d43"/><ellipse cx="37" cy="100" rx="13" ry="7" fill="#ffb8bf" opacity=".7"/><ellipse cx="133" cy="100" rx="13" ry="7" fill="#ffb8bf" opacity=".7"/><ellipse cx="86" cy="93" rx="12" ry="8" fill="#273241"/><path d="M74 107 Q86 126 99 107" fill="#e95d80" stroke="#273241" stroke-width="4" stroke-linecap="round"/><ellipse cx="131" cy="128" rx="20" ry="11" fill="#273241"/><circle cx="144" cy="113" r="14" fill="#273241"/><circle cx="151" cy="105" r="4" fill="#ffb7c2"/><circle cx="140" cy="102" r="4" fill="#ffb7c2"/></svg></div><strong>熊猫教练</strong><p id="coach">先想一想，再按键！</p></div><div class="center"><div class="muted" id="stage">键位入门 · 观察与练习</div><h2 id="question">ai 对应哪个键？</h2><div id="answer" class="answer" aria-live="polite"></div><div class="muted">请按实体键盘答题，答对自动进入下一题</div><div id="feedback" class="feedback" role="status">找到正确按键，试着按下来！</div></div><div class="actions"><button class="btn hint" id="hint">💡 提示</button><button class="btn" id="retry">↺ 重试</button><button class="btn primary" id="next" disabled>答对自动继续</button><div class="notice" style="grid-column:span 2;text-align:center">答对自动继续，无需点击</div></div></section>
<section class="keyboardPanel"><div class="kbhead"><strong>⌨️ 双拼键盘</strong><div class="mode"><span class="muted">练习模式</span><button id="guided" class="selected">提示模式</button><button id="independent">独立模式</button><button id="sound">🔊 音效开</button></div></div><div class="keyboard" id="keyboard"></div></section>
<section class="bottom"><div class="tile fingerLegend"><strong>🖐️ 指法颜色提示</strong><div class="fingerChips" id="fingerLegend"></div></div><div class="tile"><strong>💡 本题提示</strong><span id="tip">先观察键盘，找到拼音所在位置。</span></div><div class="tile"><strong>🖐️ 指法提示</strong><span id="fingerTip">请先想一想该用哪根手指。</span><span id="reminder" class="gone">先想一想，再按键；答错了可以重试。</span></div><div class="tile"><strong>🌱 我的进步</strong><span id="growth">连续答对 0 题</span></div></section></main>
<script>
(()=>{
"use strict";
const el=id=>document.getElementById(id);
const mapping={q:['iu'],w:['ei'],e:['e'],r:['uan','üan'],t:['üe'],y:['un','ün'],u:['sh'],i:['ch'],o:['o','uo'],p:['ie'],a:['a'],s:['ong','iong'],d:['ai'],f:['en'],g:['eng'],h:['ang'],j:['an'],k:['ing','uai'],l:['iang','uang'],z:['ou'],x:['ia','ua'],c:['ao'],v:['zh','ui'],b:['in'],n:['iao'],m:['ian']};
const fingers={"q":0,"a":0,"z":0,"w":1,"s":1,"x":1,"e":2,"d":2,"c":2,"r":3,"t":3,"f":3,"g":3,"v":3,"b":3,"y":4,"u":4,"h":4,"j":4,"n":4,"m":4,"i":5,"k":5,"o":6,"l":6,"p":7,",":5,".":6,"/":7,";":7};const fingerNames=["左小指","左无名指","左中指","左食指","右食指","右中指","右无名指","右小指"];
const names=['键位入门','声母练习','韵母练习','双拼组合'];
const banks=[
[['ai','d'],['ang','h'],['ei','w'],['ao','c'],['en','f'],['an','j'],['ing','k'],['ou','z'],['ian','m'],['in','b']],
[['zh','v'],['ch','i'],['sh','u'],['b','b'],['p','p'],['m','m'],['f','f'],['j','j'],['t','t'],['n','n']],
[['iang','l'],['iao','n'],['ie','p'],['uan','r'],['üe','t'],['ong','s'],['ua','x'],['uai','k'],['ui','v'],['iu','q']],
[['双 shuāng','ul'],['拼 pīn','pb'],['中 zhōng','vs'],['国 guó','go'],['学 xué','xt'],['你 nǐ','ni'],['好 hǎo','hc'],['我 wǒ','wo'],['快 kuài','kk'],['乐 lè','le']]
];

const fingerGroups=[
['左手小指','qaz'],['左手无名指','wsx'],['左手中指','edc'],['左手食指','rtfgvb'],
['右手食指','yuhjnm'],['右手中指','ik'],['右手无名指','ol'],['右手小指','p'],
['F、J 定位键','fj'],['双手混合指法','qazwsxedcrtfgvbyuhj n mikolp'.replace(/ /g,'')]
];
let fingerStage=true,fingerLesson=0,fingerPassed=0,fingerAttempts=0,fingerFirstCorrect=0;
try{fingerPassed=Math.max(0,Math.min(10,Number(localStorage.getItem('sp-finger-passed')||0)))}catch(e){}
function fingerQuestions(i){const letters=fingerGroups[i][1].replace(/ /g,'');const arr=[];for(let n=0;n<10;n++){const k=letters[n%letters.length];arr.push([k.toUpperCase(),k])}return shuffle(arr)}
function fingerStart(i){fingerStage=true;fingerLesson=Math.min(i,Math.max(0,fingerPassed));state.level=0;state.index=0;state.questions=fingerQuestions(fingerLesson);state.missed=[];fingerAttempts=0;fingerFirstCorrect=0;show()}
function enterDouble(){fingerStage=false;start(0)}

const storageKey='shuangpin-child-v2';let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}
let state={level:0,index:0,questions:[],input:'',phase:'typing',mode:'guided',hint:0,wrong:0,firstTry:true,streak:0,points:Number(saved.points)||0,sound:true,missed:[],awaitingFinal:false};
const max=10;
function shuffle(a){const out=[...a];for(let i=out.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function question(){return state.questions[state.index]}
function save(){try{localStorage.setItem(storageKey,JSON.stringify({points:state.points,level:state.level}))}catch(e){}}
function tone(ok){if(!state.sound)return;try{let C=window.AudioContext||window.webkitAudioContext;let c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=ok?660:260;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09);o.onended=()=>c.close()}catch(e){}}
function drawKeyboard(){const rows=[['qwertyuiop',0],['asdfghjkl',.4],['zxcvbnm',.8]];let inner=rows.map(([letters,offset])=>'<div class="keyrow" style="padding-left:'+offset*3+'%">'+[...letters].map(k=>'<button class="key finger-'+fingers[k]+'" data-key="'+k+'" aria-label="'+k.toUpperCase()+' '+mapping[k].join('、')+'"><b>'+k.toUpperCase()+'</b><small>'+ (state.mode==='guided'?mapping[k].join(' / '):'') +'</small></button>').join('')+'</div>').join('');inner+='<div class="keyrow"><button class="key wide" data-action="retry">Ctrl</button><button class="key wide">Alt</button><button class="key space" data-action="next"><b>空格</b></button><button class="key wide">Alt</button><button class="key wide">Ctrl</button></div>';el('keyboard').innerHTML=inner;el('keyboard').querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>type(b.dataset.key)));el('keyboard').querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>({next:next,retry:retry,hint:hint}[b.dataset.action])()));mark()}
function mark(key,kind){el('keyboard').querySelectorAll('[data-key]').forEach(node=>node.classList.remove('target','correct','incorrect','pressed'));if(key){const node=el('keyboard').querySelector('[data-key="'+key+'"]');if(node)node.classList.add(kind)}}
function updateFingerHint(){const q=question();const key=q[1][state.input.length]||q[1][0];el('fingerTip').textContent=fingerStage?'请用'+fingerNames[fingers[key]]+'按 '+key.toUpperCase()+' 键；然后回到基准位。':state.mode==='guided'&&state.hint>0?'请用'+fingerNames[fingers[key]]+'按 '+key.toUpperCase()+' 键。':'请先想一想该用哪根手指。';}
function show(){const q=question();state.input='';state.phase='typing';state.hint=0;state.wrong=0;state.firstTry=true;el('question').textContent=fingerStage?'请用正确手指按 '+q[0]+' 键':state.level===3?'输入「'+q[0]+'」的双拼':q[0]+' 对应哪个键？';el('stage').textContent=fingerStage?'指法基础训练 · '+fingerGroups[fingerLesson][0]+'（'+(fingerLesson+1)+'/10）':names[state.level]+' · '+(state.mode==='guided'?'提示模式':'独立模式');el('progressLabel').textContent='第'+(state.index+1)+'题 / 共'+state.questions.length+'题';el('progressBar').style.width=state.index/state.questions.length*100+'%';el('levelTitle').textContent=fingerStage?'指法训练 '+(fingerLesson+1)+'/10': '双拼第'+(state.level+1)+'关｜'+names[state.level];el('score').textContent=state.points;el('coach').textContent=fingerStage?'看颜色，按完回到 F、J 基准位置！':'先想一想，再按键！';el('feedback').textContent='请按实体键盘作答，也可以点击屏幕键盘。';el('tip').textContent=fingerStage?'本组练习：'+fingerGroups[fingerLesson][1].toUpperCase()+'。按完返回基准键。':state.mode==='guided'?'先观察键盘，找出对应按键。':'独立模式：拼音提示已隐藏。';el('reminder').textContent='易混提醒：读清拼音，再找对应的键。';el('growth').textContent='连续答对 '+state.streak+' 题';el('next').disabled=true;el('next').textContent='答对自动进入下一题';el('hint').disabled=false;drawSlots();mark();updateFingerHint()}
function drawSlots(){el('answer').innerHTML=Array.from({length:question()[1].length},(_,i)=>'<span class="slot">'+(state.input[i]||'？').toUpperCase()+'</span>').join('')}
function start(level){state.level=level;state.index=0;state.questions=shuffle(banks[level]).slice(0,max);state.missed=[];state.awaitingFinal=false;show();save()}
function type(k){if(state.phase!=='typing'||!(/^[a-z]$/.test(k)))return;const q=question(),goal=q[1];state.input+=k;drawSlots();mark(k,'pressed');updateFingerHint();if(state.input.length===goal.length){if(fingerStage&&state.firstTry){fingerAttempts++}if(state.input===goal){if(fingerStage&&state.firstTry){fingerFirstCorrect++}state.phase='correct';if(state.firstTry){state.points+=state.hint?5:10;state.streak++}else{state.points+=2;state.streak=0}el('feedback').textContent='✅ 答对了！自动进入下一题。';el('next').textContent='自动继续';el('coach').textContent='真棒！继续保持！';el('growth').textContent='连续答对 '+state.streak+' 题';el('next').disabled=false;el('hint').disabled=true;mark(goal[goal.length-1],'correct');tone(true);save();next()}else{state.phase='wrong';state.firstTry=false;state.wrong++;state.streak=0;state.missed.push(q[0]);el('feedback').textContent='本题未答对，已记录错题，自动进入下一题。';el('coach').textContent='没关系，再找一找！';el('reminder').textContent='你按了 '+state.input.toUpperCase()+'，再尝试一次。';el('growth').textContent='连续答对 0 题';el('next').disabled=false;el('next').textContent='自动继续';mark(k,'incorrect');tone(false);next()}}}
function retry(){if(state.phase==='finished')return;state.input='';state.phase='typing';state.firstTry=false;drawSlots();mark();el('feedback').textContent='再试一次！找准字母再按。';el('next').disabled=true;el('next').textContent='下一题（空格键） →';el('hint').disabled=false}
function hint(){if(state.phase==='finished'||state.phase==='correct')return;el('next').disabled=true;el('next').textContent='下一题（空格键） →';const q=question(),goal=q[1];state.hint=Math.min(2,state.hint+1);state.input='';state.phase='typing';state.firstTry=false;drawSlots();const line='QWERTYUIOP'.includes(goal[0])?'第一排':'ASDFGHJKL'.includes(goal[0])?'中间一排':'最下面一排';if(state.hint===1){el('tip').textContent='位置线索：先找'+line+'。';el('feedback').textContent='💡 熊猫提示：先找'+line+'，然后自己按。';mark();updateFingerHint()}else{el('tip').textContent='答案提示：'+goal.toUpperCase()+'。再用实体键盘按一遍。';el('feedback').textContent='💡 提示键位：'+goal.toUpperCase()+'。请自己按出来。';mark(goal[0],'target');updateFingerHint()}}
function next(){if(state.phase==='finished'){if(fingerStage){if(fingerFirstCorrect>=9){if(fingerPassed<=fingerLesson){fingerPassed=fingerLesson+1;try{localStorage.setItem('sp-finger-passed',String(fingerPassed))}catch(e){}}if(fingerPassed>=fingerGroups.length){enterDouble()}else{fingerStart(fingerPassed)}}else{fingerStart(fingerLesson)}return}start(state.level===banks.length-1?0:state.level+1);return}if(state.phase!=='correct'&&state.phase!=='wrong')return;if(state.index+1>=state.questions.length){state.phase='finished';el('question').textContent=fingerStage?'🎉 指法训练完成！':'🎉 本关完成！';el('answer').innerHTML='<strong>获得 '+state.points+' 积分</strong>';el('feedback').textContent=fingerStage?'首次独立答对 '+fingerFirstCorrect+'/10。至少9题正确才解锁下一区域。请注意：网页无法检测实际使用哪根手指，需要自行对照。':'完成这一关！本轮需要巩固的内容：'+(state.missed.length?[...new Set(state.missed)].join('、'):'本轮没有答错的题目')+'。';el('coach').textContent='你真棒！';el('progressBar').style.width='100%';el('tip').textContent='通关后可以继续下一关。';el('next').disabled=false;el('next').textContent=fingerStage?(fingerFirstCorrect>=9?'进入下一组（空格键） →':'再练本组（空格键） →'):state.level===3?'重新开始 →':'进入下一关 →';return}state.index++;show()}
function changeMode(mode){state.mode=mode;el('guided').classList.toggle('selected',mode==='guided');el('independent').classList.toggle('selected',mode==='independent');drawKeyboard();if(fingerStage){fingerStart(fingerLesson)}else{start(state.level)}}
el('next').addEventListener('click',next);el('hint').addEventListener('click',hint);el('retry').addEventListener('click',retry);el('guided').addEventListener('click',()=>changeMode('guided'));el('independent').addEventListener('click',()=>changeMode('independent'));el('sound').addEventListener('click',()=>{state.sound=!state.sound;el('sound').textContent=state.sound?'🔊 音效开':'🔇 音效关'});
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'||e.key===' '||e.key==='Spacebar'){e.preventDefault();if(state.phase==='wrong'||state.phase==='finished')next();return}if(/^[a-z]$/i.test(e.key)){e.preventDefault();type(e.key.toLowerCase())}else if(e.key==='Backspace'&&state.phase==='typing'){e.preventDefault();state.input=state.input.slice(0,-1);drawSlots()}else if(e.key==='Escape'){retry()}});
el('fingerLegend').innerHTML=fingerNames.map((name,i)=>'<span class="fingerChip"><i class="fingerDot finger-'+i+'"></i>'+name+'</span>').join('')+'<span class="fingerChip"><i class="fingerDot thumb"></i>拇指按空格</span>';
if(fingerPassed<fingerGroups.length){fingerStart(fingerPassed)}else{enterDouble()}
})();
</script></body></html>
