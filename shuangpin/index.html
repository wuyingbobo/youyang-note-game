function save(){try{localStorage.setItem(storageKey,JSON.stringify({points:state.points,level:state.level}))}catch(e){}}
function tone(ok){if(!state.sound)return;try{let C=window.AudioContext||window.webkitAudioContext;let c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=ok?660:260;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09);o.onended=()=>c.close()}catch(e){}}
function drawKeyboard(){const rows=[['qwertyuiop',0],['asdfghjkl',.4],['zxcvbnm',.8]];let inner=rows.map(([letters,offset])=>'<div class="keyrow" style="padding-left:'+offset*3+'%">'+[...letters].map(k=>'<button class="key" data-key="'+k+'" aria-label="'+k.toUpperCase()+' '+mapping[k].join('、')+'"><b>'+k.toUpperCase()+'</b><small>'+ (state.mode==='guided'?mapping[k].join(' / '):'') +'</small></button>').join('')+'</div>').join('');inner+='<div class="keyrow"><button class="key wide" data-action="retry">Ctrl</button><button class="key wide">Alt</button><button class="key space" data-action="next"><b>空格（下一题）</b></button><button class="key wide">Alt</button><button class="key wide">Ctrl</button></div>';el('keyboard').innerHTML=inner;el('keyboard').querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>type(b.dataset.key)));el('keyboard').querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>({next:next,retry:retry,hint:hint}[b.dataset.action])()));mark()}
function mark(key,kind){el('keyboard').querySelectorAll('[data-key]').forEach(node=>node.classList.remove('target','correct','incorrect','pressed'));if(key){const node=el('keyboard').querySelector('[data-key="'+key+'"]');if(node)node.classList.add(kind)}}
function show(){const q=question();state.input='';state.phase='typing';state.hint=0;state.wrong=0;state.firstTry=true;el('question').textContent=state.level===3?'输入「'+q[0]+'」的双拼':q[0]+' 对应哪个键？';el('stage').textContent=names[state.level]+' · '+(state.mode==='guided'?'提示模式':'独立模式');el('progressLabel').textContent='第'+(state.index+1)+'题 / 共'+state.questions.length+'题';el('progressBar').style.width=state.index/state.questions.length*100+'%';el('levelTitle').textContent='第'+(state.level+1)+'关｜'+names[state.level];el('score').textContent=state.points;el('coach').textContent='先想一想，再按键！';el('feedback').textContent='请按实体键盘作答，也可以点击屏幕键盘。';el('tip').textContent=state.mode==='guided'?'先观察键盘，找出对应按键。':'独立模式：拼音提示已隐藏。';el('reminder').textContent='易混提醒：读清拼音，再找对应的键。';el('growth').textContent='连续答对 '+state.streak+' 题';el('next').disabled=true;el('next').textContent='下一题（空格键） →';el('hint').disabled=false;drawSlots();mark()}
function drawSlots(){el('answer').innerHTML=Array.from({length:question()[1].length},(_,i)=>'<span class="slot">'+(state.input[i]||'？').toUpperCase()+'</span>').join('')}
function start(level){state.level=level;state.index=0;state.questions=shuffle(banks[level]).slice(0,max);state.missed=[];state.awaitingFinal=false;show();save()}
function type(k){if(state.phase!=='typing'||!(/^[a-z]$/.test(k)))return;const q=question(),goal=q[1];state.input+=k;drawSlots();mark(k,'pressed');if(state.input.length===goal.length){if(state.input===goal){state.phase='correct';if(state.firstTry){state.points+=state.hint?5:10;state.streak++}else{state.points+=2;state.streak=0}el('feedback').textContent='✅ 答对了！'+q[0]+' → '+goal.toUpperCase()+'。按空格键进入下一题。';el('next').textContent='下一题（空格键） →';el('coach').textContent='真棒！继续保持！';el('growth').textContent='连续答对 '+state.streak+' 题';el('next').disabled=false;el('hint').disabled=true;mark(goal[goal.length-1],'correct');tone(true);save()}else{state.phase='wrong';state.firstTry=false;state.wrong++;state.streak=0;state.missed.push(q[0]);el('feedback').textContent='这次没有答对。按空格键重试，或点击“提示”获得帮助。';el('coach').textContent='没关系，再找一找！';el('reminder').textContent='你按了 '+state.input.toUpperCase()+'，再尝试一次。';el('growth').textContent='连续答对 0 题';el('next').disabled=false;el('next').textContent='再试一次（空格键） →';mark(k,'incorrect');tone(false)}}}
function retry(){if(state.phase==='finished')return;state.input='';state.phase='typing';state.firstTry=false;drawSlots();mark();el('feedback').textContent='再试一次！找准字母再按。';el('next').disabled=true;el('next').textContent='下一题（空格键） →';el('hint').disabled=false}
function hint(){if(state.phase==='finished'||state.phase==='correct')return;el('next').disabled=true;el('next').textContent='下一题（空格键） →';const q=question(),goal=q[1];state.hint=Math.min(2,state.hint+1);state.input='';state.phase='typing';state.firstTry=false;drawSlots();const line='QWERTYUIOP'.includes(goal[0])?'第一排':'ASDFGHJKL'.includes(goal[0])?'中间一排':'最下面一排';if(state.hint===1){el('tip').textContent='位置线索：先找'+line+'。';el('feedback').textContent='💡 熊猫提示：先找'+line+'，然后自己按。';mark()}else{el('tip').textContent='答案提示：'+goal.toUpperCase()+'。再用实体键盘按一遍。';el('feedback').textContent='💡 提示键位：'+goal.toUpperCase()+'。请自己按出来。';mark(goal[0],'target')}}
function next(){if(state.phase==='finished'){start(state.level===banks.length-1?0:state.level+1);return}if(state.phase==='wrong'){retry();return}if(state.phase!=='correct')return;if(state.index+1>=state.questions.length){state.phase='finished';el('question').textContent='🎉 本关完成！';el('answer').innerHTML='<strong>获得 '+state.points+' 积分</strong>';el('feedback').textContent='完成这一关！本轮需要巩固的内容：'+(state.missed.length?[...new Set(state.missed)].join('、'):'本轮没有答错的题目')+'。';el('coach').textContent='你真棒！';el('progressBar').style.width='100%';el('tip').textContent='通关后可以继续下一关。';el('next').disabled=false;el('next').textContent=state.level===3?'重新开始 →':'进入下一关 →';return}state.index++;show()}
function changeMode(mode){state.mode=mode;el('guided').classList.toggle('selected',mode==='guided');el('independent').classList.toggle('selected',mode==='independent');drawKeyboard();start(state.level)}
el('next').addEventListener('click',next);el('hint').addEventListener('click',hint);el('retry').addEventListener('click',retry);el('guided').addEventListener('click',()=>changeMode('guided'));el('independent').addEventListener('click',()=>changeMode('independent'));el('sound').addEventListener('click',()=>{state.sound=!state.sound;el('sound').textContent=state.sound?'🔊 音效开':'🔇 音效关'});
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'||e.key===' '||e.key==='Spacebar'){e.preventDefault();next();return}if(/^[a-z]$/i.test(e.key)){e.preventDefault();type(e.key.toLowerCase())}else if(e.key==='Backspace'&&state.phase==='typing'){e.preventDefault();state.input=state.input.slice(0,-1);drawSlots()}else if(e.key==='Escape'){retry()}});
start(0);
})();
</script></body></html>
