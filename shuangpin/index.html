<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双拼闯关训练营 · 儿童版</title><style>
:root{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#19375d;background:#edf8ff}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}header{display:flex;gap:18px;align-items:center;justify-content:space-between;background:white;padding:10px 22px;border-bottom:2px solid #d5eefd;flex-wrap:wrap}h1{font-size:clamp(20px,2.6vw,30px);margin:0;color:#1677cc}small,.sub{color:#5d7694}main{max-width:1450px;margin:auto;display:grid;grid-template-columns:188px 1fr;gap:13px;padding:13px}aside,.panel{border-radius:18px;background:white;box-shadow:0 5px 18px #a6c4d425}aside{padding:12px}aside button{width:100%;margin-bottom:9px;padding:12px 10px;border-radius:14px;border:2px solid #d7e7f3;background:#f7fbff;text-align:left;color:#244465}aside button.active{background:#e0faee;border-color:#7cdeb0}aside button b{display:block}aside button span{font-size:12px;color:#677f95}.stage{min-width:0}.prompt{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 19px;flex-wrap:wrap}.prompt h2{margin:4px 0;font-size:clamp(24px,3vw,36px)}.answer{display:flex;gap:6px}.slot{height:44px;width:45px;display:grid;place-items:center;border:2px solid #8ccbf1;background:#f1faff;border-radius:10px;font-size:23px;font-weight:800}.btn{border:0;border-radius:12px;padding:10px 17px;font-weight:700;background:#2d8df0;color:white;box-shadow:0 3px 0 #1666ae}.btn.alt{background:#ffe7a4;color:#765121;box-shadow:0 3px 0 #f7c85e}.btn:disabled{opacity:.45}.keypanel{padding:15px;margin-top:12px}.keyboard{display:flex;flex-direction:column;gap:6px}.keys{display:flex;gap:6px;justify-content:center}.key{height:69px;flex:1;min-width:0;background:linear-gradient(white,#f0f7ff);border:1px solid #d5e6f6;border-bottom:4px solid #bfcee0;border-radius:10px;color:#153b68;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.key b{font-size:22px}.key em{font-style:normal;color:#db5882;font-size:13px}.key.special{background:#d9f9ea;border-color:#81d7b2}.key.target{background:#fff0b8;border-color:#edb63f}.key.pressed{background:#9fd9ff;transform:translateY(2px)}.help{padding:12px 18px;margin-top:12px}.tips{display:flex;flex-wrap:wrap;gap:8px}.tips span{background:#eff8ff;border-radius:9px;padding:8px 14px;font-size:14px}.bar{height:8px;width:150px;border-radius:8px;background:#e8f0f8;overflow:hidden}.bar>div{height:100%;background:#62c9a0;width:0}.feedback{margin:10px 0 0;padding:9px 12px;border-radius:9px;background:#eefaFF;font-size:15px;min-height:40px}.bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}#celebrate{display:none;background:#f0fff6;padding:8px;border-radius:10px;color:#187350;font-weight:700}.mascot{font-size:42px}@media(min-width:1000px){body{height:100vh;overflow:hidden}main{height:calc(100vh - 70px)}.stage{overflow:auto}.key{height:clamp(45px,8vh,72px)}}@media(max-width:700px){main{display:block;padding:8px}aside{display:flex;gap:6px;overflow:auto;margin-bottom:9px}aside button{min-width:105px;margin:0;padding:8px}.prompt{padding:10px}.keypanel{padding:7px}.key{height:55px;border-radius:6px}.key b{font-size:16px}.key em{font-size:10px}.keys{gap:3px}.keyboard{gap:3px}.bar{width:95px}} </style></head><body><header><div style="display:flex;gap:10px;align-items:center"><span class="mascot">🐼</span><div><h1>双拼闯关训练营</h1><small>每天练一点，打字更厉害！</small></div></div><div><b>⭐ <span id="score">0</span> 分</b>　<small id="progressText">第1题 / 8题</small><div class="bar"><div id="bar"></div></div></div><div><button id="sound" class="btn alt">🔊 音效开</button></div></header><main><aside id="levels"></aside><div class="stage"><section class="panel prompt"><div><small id="levelTitle">第1关 · 键位入门</small><h2 id="question">ai 对应哪个键？</h2><div class="answer" id="answer"></div></div><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="font-size:45px">🐥</span><div><button id="hint" class="btn alt">💡 提示</button> <button id="next" class="btn" disabled>下一题 →</button></div></div><div class="feedback" style="width:100%" id="feedback">看键盘上的小字，找到正确字母键！</div></section><section class="panel keypanel"><div class="bottom"><b>⌨️ 双拼键盘 · 按电脑键盘或点击下方按键</b><small>先看位置，再动手练习</small></div><div class="keyboard" id="keyboard" style="margin-top:12px"></div></section><section class="panel help"><div class="bottom"><b>💡 新手键位提示</b><button id="toggle" class="btn alt" style="padding:6px 12px">收起提示 ↑</button></div><div class="tips" id="tips" style="margin-top:10px"><span><b>D</b> = ai</span><span><b>H</b> = ang</span><span><b>V</b> = zh / ui</span><span><b>I</b> = ch</span><span><b>U</b> = sh</span><span><b>W</b> = ei</span><span><b>C</b> = ao</span></div><div id="celebrate"></div></section></div></main><script>
(()=>{
const $=x=>document.getElementById(x),layout=['qwertyuiop','asdfghjkl','zxcvbnm'];const map={q:'iu',w:'ei',e:'e',r:'uan/üan',t:'üe',y:'un/ün',u:'sh',i:'ch',o:'o/uo',p:'ie',a:'a',s:'ong/iong',d:'ai',f:'en',g:'eng',h:'ang',j:'an',k:'ing/uai',l:'iang/uang',z:'ou',x:'ia/ua',c:'ao',v:'zh/ui',b:'in',n:'iao',m:'ian'};const pool=[[['ai','d'],['ang','h'],['ei','w'],['ao','c'],['en','f'],['an','j'],['ing','k'],['ou','z'],['ian','m'],['in','b']],[['zh','v'],['ch','i'],['sh','u'],['b','b'],['p','p'],['m','m'],['f','f'],['j','j'],['t','t'],['n','n']],[['iang','l'],['iao','n'],['ie','p'],['uan','r'],['üe','t'],['ong','s'],['ua','x'],['uai','k'],['ui','v'],['iu','q']],[['双 shuāng','ul'],['拼 pīn','pb'],['中 zhōng','vs'],['国 guó','go'],['学 xué','xt'],['你 nǐ','ni'],['好 hǎo','hc'],['我 wǒ','wo'],['快 kuài','kk'],['乐 lè','le']]];let level=0,num=0,score=0,streak=0,answer='',ended=false,hinted=false,wrong=0,audio=true,round=[];try{score=+(localStorage.getItem('sp-score')||0)}catch(e){}function beep(good){if(!audio)return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),v=c.createGain();o.connect(v);v.connect(c.destination);o.type='sine';o.frequency.value=good?720:220;v.gain.value=.07;o.start();o.stop(c.currentTime+.13);o.onended=()=>c.close()}catch(e){}}function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}function begin(l){level=l;round=shuffle(pool[l]).slice(0,8);num=0;wrong=0;show();}function q(){return round[num]}function draw(){const needed=q()[1].length;$('answer').innerHTML=Array.from({length:needed},(_,i)=>'<span class="slot">'+(answer[i]||'？').toUpperCase()+'</span>').join('')}function show(){answer='';ended=false;hinted=false;$('bar').style.width=(num/8*100)+'%';$('progressText').textContent='第'+(num+1)+'题 / 8题';$('levelTitle').textContent='第'+(level+1)+'关 · '+['键位入门','声母挑战','韵母进阶','汉字双拼'][level];$('score').textContent=score;$('question').textContent=level===3?'输入「'+q()[0]+'」的双拼':q()[0]+' 对应哪个键？';$('next').disabled=true;$('next').textContent='下一题 →';$('feedback').textContent='看键盘上的小字，找到正确字母键！';$('hint').disabled=false;draw();$('levels').innerHTML=['🌱 键位入门','🔤 声母挑战','🌈 韵母进阶','🏆 汉字双拼'].map((n,i)=>'<button data-level="'+i+'" class="'+(level===i?'active':'')+'"><b>'+n+'</b><span>第'+(i+1)+'关 · 8题</span></button>').join('');document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>begin(+b.dataset.level));}function hit(key){if(ended||!(/^[a-z]$/.test(key)))return;answer+=key;const el=document.querySelector('[data-key="'+key+'"]');if(el){el.classList.add('pressed');setTimeout(()=>el.classList.remove('pressed'),180)}draw();if(answer.length>=q()[1].length){ended=true;const good=answer===q()[1];if(good){score+=hinted?5:10;streak++;$('feedback').textContent='✅ 答对啦！ '+q()[0]+' → '+q()[1].toUpperCase()+'，获得'+(hinted?5:10)+'颗积分！'}else{wrong++;streak=0;$('feedback').textContent='🔎 再记一记：正确答案是 '+q()[1].toUpperCase()+'，下一题继续加油！'}beep(good);$('score').textContent=score;$('hint').disabled=true;$('next').disabled=false;try{localStorage.setItem('sp-score',score)}catch(e){}}}function next(){if(num===7){$('bar').style.width='100%';$('question').textContent='🎉 第'+(level+1)+'关完成！';$('answer').innerHTML='<strong style="font-size:23px">答对 '+(8-wrong)+'/8 题</strong>';$('feedback').textContent='你完成了这一关！继续练习，就会越来越熟练。';$('next').textContent=level===3?'再玩一次 ↻':'进入下一关 →';$('next').disabled=false;$('next').onclick=()=>{ $('next').onclick=next;begin(level===3?3:level+1)};$('celebrate').style.display='block';$('celebrate').textContent='⭐ 恭喜完成挑战！';return}num++;show()}$('keyboard').innerHTML=layout.map((row,idx)=>'<div class="keys" style="padding-left:'+(idx*3)+'%">'+[...row].map(k=>'<button data-key="'+k+'" class="key '+('uvi'.includes(k)?'special':'')+'"><b>'+k.toUpperCase()+'</b><em>'+map[k]+'</em></button>').join('')+'</div>').join('');document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>hit(b.dataset.key));document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;if(/^[a-z]$/i.test(e.key))hit(e.key.toLowerCase());else if(e.key==='Backspace'&&!ended){answer=answer.slice(0,-1);draw()}else if(e.key==='Enter'&&!$('next').disabled)$('next').click()});$('hint').onclick=()=>{hinted=true;$('feedback').textContent='💡 提示：正确按键是 '+q()[1].toUpperCase()+'。试试自己按出来！'};$('next').onclick=next;$('sound').onclick=()=>{audio=!audio;$('sound').textContent=audio?'🔊 音效开':'🔇 音效关'};$('toggle').onclick=()=>{const e=$('tips');e.hidden=!e.hidden;$('toggle').textContent=e.hidden?'展开提示 ↓':'收起提示 ↑'};begin(0);
})();
</script></body></html>
